name: Certificates Cleanup Cron

on:
  schedule:
    # Run on the first day of every month at 04:00 AM UTC
    - cron: '0 4 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Cleanup API
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Error: NEXT_PUBLIC_APP_URL secret is not set."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Error: CRON_SECRET secret is not set."
            exit 1
          fi

          BASE_URL="${APP_URL%/}"
          echo "Triggering Cron at: $BASE_URL/api/cron/cleanup-certificates"

          RESPONSE=$(curl -sL -w "\nHTTP_STATUS:%{http_code}" -X POST "$BASE_URL/api/cron/cleanup-certificates" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          echo "Response output:"
          echo "$RESPONSE"

          if [[ "$RESPONSE" == *"HTTP_STATUS:200"* ]]; then
            echo "Cron executed successfully!"
          else
            echo "Cron execution failed!"
            exit 1
          fi
